<style>

a{color:var(--rojo)}
header.top{background:var(--azul);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:var(--sombra)}

header.top .sub{color:#aab4c8;font-size:12px;font-weight:500}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font-family:inherit;font-size:13px;font-weight:600;background:var(--rojo);color:#fff;border:0;padding:8px 13px;border-radius:7px;cursor:pointer;transition:.15s}
button:hover{background:var(--rojo-d)}
button.sec{background:var(--panel);color:var(--texto);border:1px solid var(--borde)}
button.sec:hover{background:var(--panel-2)}
button.mini{padding:4px 9px;font-size:12px}
button.danger{background:transparent;color:var(--rojoR);border:1px solid var(--borde)}

nav.tabs{display:flex;gap:2px;flex-wrap:wrap;padding:10px 20px 0;background:var(--bg);position:sticky;top:52px;z-index:40}

main{max-width:1120px;margin:0 auto;padding:18px 20px 70px}

th{background:var(--panel-2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);position:sticky;top:0}
tr:hover td{background:var(--panel-2)}

.heat td.axis{background:transparent;color:var(--suave);font-weight:600;width:auto;height:auto}
.heat .ids{font-size:10px;font-weight:600;display:block;margin-top:2px;opacity:.95}
.pill{font-size:11px;background:var(--panel-2);border:1px solid var(--borde);border-radius:20px;padding:2px 8px;color:var(--suave)}
details.guia{background:var(--panel-2);border:1px solid var(--borde);border-radius:8px;padding:10px 12px;margin-bottom:14px}
details.guia summary{cursor:pointer;font-weight:600;font-size:13px}
details.guia table{margin-top:10px}
.est{display:inline-flex;align-items:center;gap:5px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--azul);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1}
.addbar{display:flex;justify-content:flex-end;margin-top:10px}
.cell-del{text-align:center}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;color:var(--rojo)}
progress{width:100%;height:10px;border-radius:6px;overflow:hidden}
hr{border:0;border-top:1px solid var(--borde);margin:16px 0}
/* ===== Documento / impresión ===== */
#doc-render{background:#fff;color:#111;padding:0}
#doc-render h1,#doc-render h2,#doc-render h3{color:#111}
#doc-print{display:none}
@media print{
  header.top,nav.tabs,.no-print,#toast{display:none!important}
  main{max-width:none;padding:0}
  .panel{box-shadow:none;border:0;padding:0}
  #doc-print{display:block}
  .tab-sec{display:none!important}
  #tab-documento{display:block!important}
  body{background:#fff}
  .pagebreak{page-break-before:always}
  table{font-size:11px}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

</style>

let D = cargar();
function cargar(){ try{ const s=localStorage.getItem(LS_KEY); if(s) return JSON.parse(s);}catch(e){} return datosPorDefecto(); }

/* ============================ CÁLCULOS ============================ */
function nivel(r){ if(r<=5)return"Bajo"; if(r<=9)return"Medio"; if(r<=16)return"Alto"; return"Crítico"; }
function clsNivel(n){ return 'n-'+n.toLowerCase().replace('í','i'); }
function ridFull(rk){ return 'R-G'+D.grupo+'-'+String(rk.n).padStart(2,'0'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sobreCriterio(r){ return r>9; }

/* ============================ NAV ============================ */
const TABS=[
  ["resumen","① Resumen"],["alcance","② Alcance"],["inventario","③ Inventario"],
  ["identificacion","④ Identificación"],["matriz","⑤ Matriz"],["tratamiento","⑥ Tratamiento"],
  ["migracion","⑦ Migración"],["verificacion","⑧ Verificación"],["politica","⑨ Política"],["documento","⑩ Documento"]
];
let actual='resumen';
function initTabs(){
  const nav=document.getElementById('tabs');
  nav.innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" onclick="irA('${k}')">${l}</button>`).join('');
}
function irA(k){ actual=k; TABS.forEach(([t])=>{document.getElementById('tab-'+t).hidden=(t!==k);});
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
  render(); window.scrollTo(0,0);
}

/* ---- ⑤ Matriz ---- */
function selPI(ix,campo,val){
  const esc_=ESCALA_P; const escA=(campo==='p')?ESCALA_P:ESCALA_I;
  let o='';for(let v=1;v<=5;v++){o+=`<option value="${v}" ${v==val?'selected':''} title="${esc(escA[v])}">${v}</option>`;}
  return `<select onchange="D.riesgos[${ix}].${campo}=+this.value; render()">${o}</select>`;
}
function rMatriz(){
  const rs=D.riesgos.slice().sort((a,b)=>(b.p*b.i)-(a.p*a.i));
  const filas=rs.map(r=>{const R=r.p*r.i,nv=nivel(R),ix=D.riesgos.indexOf(r);
    return `<tr>
      <td><strong>${ridFull(r)}</strong></td>
      <td>${esc(r.activo)}<div class="muted">${esc(r.amenaza)}</div></td>
      <td style="width:70px">${selPI(ix,'p',r.p)}</td>
      <td style="width:70px">${selPI(ix,'i',r.i)}</td>
      <td style="text-align:center;font-weight:800">${R}</td>
      <td><span class="badge ${clsNivel(nv)}">${nv}</span></td>
    </tr>`;}).join('');
  // heatmap
  let heat='<table class="heat"><tbody>';
  for(let i=5;i>=1;i--){ heat+=`<tr><td class="axis">I=${i}</td>`;
    for(let p=1;p<=5;p++){ const R=p*i,nv=nivel(R);
      const ids=D.riesgos.filter(r=>r.p===p&&r.i===i).map(ridFull).map(x=>x.replace('R-G'+D.grupo+'-','')).join(' ');
      heat+=`<td class="${clsNivel(nv)}">${R}${ids?`<span class="ids">${ids}</span>`:''}</td>`;
    } heat+='</tr>';
  }
  heat+='<tr><td class="axis"></td>'+[1,2,3,4,5].map(p=>`<td class="axis">P=${p}</td>`).join('')+'</tr></tbody></table>';
  document.getElementById('tab-matriz').innerHTML=`
    <div class="panel">
      <h2 class="titulo">Matriz de riesgos inherentes — R = P × I</h2>
      <details class="guia"><summary>📏 Guía de cálculo (escala de referencia de P e I)</summary>
        <div class="scroll"><table><thead><tr><th>Nivel</th><th>Probabilidad (P)</th><th>Impacto (I)</th></tr></thead><tbody>
        ${[1,2,3,4,5].map(v=>`<tr><td><strong>${v}</strong></td><td>${esc(ESCALA_P[v])}</td><td>${esc(ESCALA_I[v])}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="muted" style="margin-top:8px">Clasificación: Bajo 1–5 · Medio 6–9 · Alto 10–16 · Crítico 17–25. Criterio de aceptación: ≤ 9.</p>
      </details>
      <div class="scroll"><table><thead><tr><th>ID</th><th>Activo / Amenaza</th><th>P</th><th>I</th><th>R</th><th>Nivel</th></tr></thead><tbody>${filas}</tbody></table></div>
      <h3 style="margin-top:22px">Matriz de calor 5×5</h3>
      <p class="muted">Cada celda muestra R = P × I y los riesgos ubicados (número correlativo).</p>
      <div class="scroll">${heat}</div>
    </div>`;
}

      <div class="addbar"><button onclick="addVerif()">＋ Agregar prueba</button></div>
      <h3 style="margin-top:20px">Comparación: riesgo inherente vs. residual</h3>
      <div class="scroll"><table><thead><tr><th>ID</th><th>Inherente</th><th>Residual</th><th>vs. criterio (≤ 9)</th></tr></thead><tbody>${comp}</tbody></table></div>
    </div>`;
}
function addVerif(){ D.verificacion.push({prueba:"",resultado:"",riesgo:""}); render(); }
function delVerif(ix){ if(confirm('¿Eliminar prueba?')){ D.verificacion.splice(ix,1); render(); } }

/* ---- ⑨ Política ---- */
function rPolitica(){
  const p=D.politica;
  document.getElementById('tab-politica').innerHTML=`
    <div class="panel">
      <h2 class="titulo">Política de seguridad de la información</h2>
      <label class="f"><span>Política general (objetivo, alcance, roles, marco normativo, lineamientos, sanciones, ciclo de revisión)</span>
        <textarea style="min-height:140px" oninput="D.politica.general=this.value" onchange="guardar()">${esc(p.general)}</textarea></label>
      <label class="f"><span>Política específica — ámbito on premise (con riesgos que mitiga)</span>
        <textarea oninput="D.politica.onpremise=this.value" onchange="guardar()">${esc(p.onpremise)}</textarea></label>
      <label class="f"><span>Política específica — ámbito on cloud / AWS (con riesgos que mitiga)</span>

      <p class="muted">Fundamento normativo: ISO/IEC 27001:2022, ISO/IEC 27002:2022, NIST CSF 2.0, Ley 21.663 (Marco de Ciberseguridad) y Ley 21.719 (Protección de Datos Personales).</p>
    </div>`;
}

/* ---- ⑩ Documento ---- */
function rDocumento(){
  document.getElementById('tab-documento').innerHTML=`
    <div class="panel no-print">
      <h2 class="titulo">Documento técnico (PDF)</h2>
      <p class="muted">Genera el documento técnico completo a partir de los datos registrados. Usa el botón para abrir el diálogo de impresión y guardar como PDF (destino: «Guardar como PDF»).</p>
      <button onclick="window.print()">🖨 Generar / descargar PDF</button>
    </div>
    <div class="panel" id="doc-print">${documentoHTML()}</div>`;
}
function documentoHTML(){
  const rs=D.riesgos, porNivel={Bajo:0,Medio:0,Alto:0,Crítico:0}; rs.forEach(r=>porNivel[nivel(r.p*r.i)]++);
  const sortInh=rs.slice().sort((a,b)=>(b.p*b.i)-(a.p*a.i));
  // heat
  let heat='<table class="heat"><tbody>';
  for(let i=5;i>=1;i--){ heat+=`<tr><td class="axis">I=${i}</td>`;
    for(let p=1;p<=5;p++){ const R=p*i,nv=nivel(R);
      const ids=rs.filter(r=>r.p===p&&r.i===i).map(r=>String(r.n).padStart(2,'0')).join(' ');
      heat+=`<td class="${clsNivel(nv)}">${R}${ids?`<span class="ids">${ids}</span>`:''}</td>`;
    } heat+='</tr>'; }
  heat+='<tr><td class="axis"></td>'+[1,2,3,4,5].map(p=>`<td class="axis">P=${p}</td>`).join('')+'</tr></tbody></table>';
  const G=esc(D.grupo);
  return `
  <div style="text-align:center;padding:30px 0 10px">
    <div style="font-size:30px;font-weight:800;color:var(--rojo)">DARSR</div>
    <h1 style="margin:6px 0">Migración Segura de Infraestructura On Premise a AWS</h1>
    <p>Sistema de Gestión de Riesgos — TecnoNorte</p>
    <p><strong>Grupo ${G}</strong> · ${esc(D.integrantes)}</p>
    <p>Fecha: ${esc(D.fecha)}</p>
    <p>Sistema: <a href="${esc(D.urlSistema)}">${esc(D.urlSistema)}</a><br>Repositorio: <a href="${esc(D.urlRepo)}">${esc(D.urlRepo)}</a></p>
    <p class="muted">Diseño de Arquitectura de Redes Seguras · INACAP La Serena · Docente: Daniel Ruz Moreno</p>
  </div>
  <div class="pagebreak"></div>
  <h2>1. Panel de resumen del proyecto</h2>
  <table><tbody>
    <tr><th>Activos</th><td>${D.inventario.length}</td><th>Riesgos</th><td>${rs.length}</td></tr>
    <tr><th>Críticos</th><td>${porNivel.Crítico}</td><th>Altos</th><td>${porNivel.Alto}</td></tr>
    <tr><th>Medios</th><td>${porNivel.Medio}</td><th>Bajos</th><td>${porNivel.Bajo}</td></tr>
    <tr><th>Riesgos sobre criterio (inherente)</th><td>${rs.filter(r=>sobreCriterio(r.p*r.i)).length}</td>
        <th>Riesgos sobre criterio (residual)</th><td>${rs.filter(r=>sobreCriterio(r.pr*r.ir)).length}</td></tr>
  </tbody></table>

  <h2>2. Alcance del SGSI y criterio de aceptación</h2>
  <p><strong>Alcance:</strong> ${esc(D.alcance.descripcion)}</p>
  <p><strong>Objetivos:</strong> ${esc(D.alcance.objetivos)}</p>
  <p><strong>Criterio de aceptación:</strong> ${esc(D.alcance.criterio)}</p>

  <h2>3. Inventario de activos on premise</h2>
  <table><thead><tr><th>ID</th><th>Activo</th><th>Tipo</th><th>Zona</th><th>IP</th><th>Servicio</th><th>Clasificación</th><th>Responsable</th></tr></thead><tbody>
  ${D.inventario.map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.activo)}</td><td>${esc(a.tipo)}</td><td>${esc(a.zona)}</td><td>${esc(a.ip)}</td><td>${esc(a.servicio)}</td><td>${esc(a.clasif)}</td><td>${esc(a.resp)}</td></tr>`).join('')}
  </tbody></table>

  <h2>4. Amenazas, vulnerabilidades y evidencias</h2>
  <table><thead><tr><th>ID</th><th>Activo</th><th>Amenaza</th><th>Vulnerabilidad</th><th>Evidencia</th></tr></thead><tbody>
  ${rs.map(r=>`<tr><td>${ridFull(r)}</td><td>${esc(r.activo)}</td><td>${esc(r.amenaza)}</td><td>${esc(r.vuln)}</td><td>${esc(r.fuente)}</td></tr>`).join('')}
  </tbody></table>

  <h2>5. Matriz de riesgo inherente</h2>
  <table><thead><tr><th>ID</th><th>Activo</th><th>P</th><th>I</th><th>R</th><th>Nivel</th></tr></thead><tbody>
  ${sortInh.map(r=>{const R=r.p*r.i;return `<tr><td>${ridFull(r)}</td><td>${esc(r.activo)}</td><td>${r.p}</td><td>${r.i}</td><td><strong>${R}</strong></td><td><span class="badge ${clsNivel(nivel(R))}">${nivel(R)}</span></td></tr>`;}).join('')}
  </tbody></table>
  <h3>Matriz de calor 5×5</h3>${heat}

  <h2>6. Plan de tratamiento con controles ISO/IEC 27001:2022</h2>
  <table><thead><tr><th>ID</th><th>Opción</th><th>Control (Anexo A)</th><th>Acción</th><th>Residual</th></tr></thead><tbody>
  ${sortInh.map(r=>{const Rr=r.pr*r.ir;return `<tr><td>${ridFull(r)}</td><td>${esc(r.opcion)}</td><td>${esc(r.control)}</td><td>${esc(r.accion)}</td><td><span class="badge ${clsNivel(nivel(Rr))}">${nivel(Rr)} ${Rr}</span></td></tr>`;}).join('')}
  </tbody></table>

  <h2>7. Plan de migración, arquitectura AWS y responsabilidad compartida</h2>
  <p><strong>Arquitectura:</strong> ${esc(D.migracion.arquitectura)}</p>
  <p><strong>Responsabilidad compartida:</strong> ${esc(D.migracion.responsabilidad)}</p>
  <table><thead><tr><th>Etapa</th><th>Descripción</th><th>Estado</th><th>Evidencia</th></tr></thead><tbody>
  ${D.migracion.etapas.map(e=>`<tr><td>${esc(e.etapa)}</td><td>${esc(e.desc)}</td><td>${esc(e.estado)}</td><td>${esc(e.evidencia)}</td></tr>`).join('')}
  </tbody></table>

  <h2>8. Verificación y riesgo residual</h2>
  <table><thead><tr><th>Prueba</th><th>Resultado</th><th>Riesgo</th></tr></thead><tbody>
  ${D.verificacion.map(v=>`<tr><td>${esc(v.prueba)}</td><td>${esc(v.resultado)}</td><td>${esc(v.riesgo)}</td></tr>`).join('')}
  </tbody></table>
  <table><thead><tr><th>ID</th><th>Inherente</th><th>Residual</th></tr></thead><tbody>
  ${sortInh.map(r=>{const R=r.p*r.i,Rr=r.pr*r.ir;return `<tr><td>${ridFull(r)}</td><td><span class="badge ${clsNivel(nivel(R))}">${nivel(R)} ${R}</span></td><td><span class="badge ${clsNivel(nivel(Rr))}">${nivel(Rr)} ${Rr}</span></td></tr>`;}).join('')}
  </tbody></table>

  <h2>9. Política de seguridad de la información</h2>
  <p><strong>Política general:</strong> ${esc(D.politica.general)}</p>
  <p><strong>Política on premise:</strong> ${esc(D.politica.onpremise)}</p>
  <p><strong>Política on cloud:</strong> ${esc(D.politica.oncloud)}</p>
  `;
}

/* ============================ JSON ============================ */
function exportJSON(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='proyecto-grupo'+D.grupo+'.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('JSON exportado');
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader(); rd.onload=()=>{ try{ D=JSON.parse(rd.result); guardar(); render(); toast('Datos importados'); }catch(e){ alert('Archivo JSON inválido'); } };
  rd.readAsText(f); ev.target.value='';
}

/* ============================ UI ============================ */
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function toggleTema(){ const r=document.documentElement; const n=r.getAttribute('data-theme')==='dark'?'light':'dark'; r.setAttribute('data-theme',n); try{localStorage.setItem('darsr_tema',n);}catch(e){} }
(function initTema(){ try{ const t=localStorage.getItem('darsr_tema'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){} })();

/* ============================ INICIO ============================ */
initTabs(); irA('resumen');
</script>
